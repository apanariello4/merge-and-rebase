common:
  seed: 42
  device: cuda
  dtype: fp32
  backbone:
    name: dinov2
    model_id: facebook/dinov2-base
  data:
    batch_size: 32
    num_workers: 4
    val_fraction: 0.1
    split_seed: 42
  train:
    epochs: null
    optimizer:
      name: adamw
    lr: 0.001
    weight_decay: 0.0
    accumulate_grad_batches: 4
    lr_scheduler:
      name: cosine
      warmup_steps: 0
    grad_clip_norm: 1.0
    early_stopping: false
  strategy:
    name: linear_probe
    forward_mode: standard
    params: {}
  output:
    out_dir: checkpoints/dinov2/vision20/linear_probe
    save_format: full
    save_last_epoch: true
  logging:
    use_wandb: false
