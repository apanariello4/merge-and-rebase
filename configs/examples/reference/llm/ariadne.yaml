# Ariadne on Qwen2.5 (0.5B -> 1.5B, ifeval) — reference config (every accepted key, annotated).
#
# Run:   python -m merge_and_rebase.eval.llm_rebase --config configs/examples/reference/llm/ariadne.yaml
# Twin:  configs/examples/qwen2.5_0.5b_to_1.5b_ariadne.json (same active keys; tests/test_reference_configs.py)
#
# Legend
#   Active lines are the recommended setup (24 -> 28 decoder layers, preset "ariadne", alpha 1, ifeval).
#   "# key: value  # ..." lines list every other accepted key AT ITS DEFAULT: uncommenting one changes one factor.
#   Tags: [main] used by the method as published, [ablation] alternative arm, [diagnostic] extra measurement,
#         never changes the task vector, [legacy] kept for old configs, [BRACE-only] inert under
#         depth_alignment.rule=discrete_index_match, [vision-only] the decoder ignores it (warning + summary note).
#         [default: decoder] = decoder default filled when absent; [default: preset] = set by preset: ariadne.
#   Ariadne fits the target directly on the native source pair (no depth prestep, no parameter transport): only
#   down_proj (mlp.c_proj) weights and their materialized biases change. Method contract: docs/methods/ariadne.md.
#   Vision keys (merge_mode, alpha_selection, alpha_patience, alpha_search_split, LMC keys, strict_load,
#   save_transported_tvs*) are not read by llm_rebase and are omitted.
# Provenance: commit before launching; the summary records the git commit/dirty fingerprint.
# Unknown method.params keys of THESEUS/BiCo raise; unknown top-level keys are ignored.
# Canonical names (rebase/config_schema.py); the legacy flat names still work and warn.


# ---------------------------------------------------------------- suite
# suite: null                               # nli6.
# tasks: null                               # "all", CSV or list of suite tasks.

# ---------------------------------------------------------------- method (name + its own parameters)
method:
  name: ariadne                             # Ariadne (legacy alias: direct_residual, same method object).
  # Ariadne fits, per target layer boundary, the down_proj correction that makes the target reproduce the source's
  # fine-tuned effect, read through a Procrustes alignment of paired, padding-free activations. The task vector is
  # only this fit. Unknown keys raise. Layering: decoder defaults < preset < explicit keys.
  params:
    preset: ariadne                         # [main] components=[mlp.c_proj], activation_storage=streaming,
                                            #   ridge_estimator=empirical_bayes (the decoder defaults agree).
    num_batches: 100                        # [main] calibration batches (never part of the preset).
    seed: 0                                 # calibration sampling seed; equal to the THESEUS/BiCo seed so all
                                            #   methods draw the same calibration batches.
    streaming_position_chunk: 14            # layer positions per capture sweep (28 positions -> 2 sweeps): bounds
                                            #   the memory of the streaming statistics; null = all at once.
    # components: ["mlp.c_proj"]            # [main] [default: preset] fitted projections (mlp.c_proj = down_proj);
    #                                       #   ["attn.out_proj", "mlp.c_proj"] = O+D ablation arm (o_proj + down_proj).
    # activation_storage: "streaming"       # [main] [default: preset] streaming | resident.
    # ridge_estimator: "empirical_bayes"    # [main] [default: preset] empirical_bayes | fixed_relative | none.
    # missing_bias: "materialize"           # [main] [default: decoder] Qwen down_proj has no bias: materialize adds a
    #                                       #   zero-initialised down_proj.bias that the fit fills; skip (needs
    #                                       #   exact_form=false) keeps the stock architecture and is the paper's
    #                                       #   bias-free formulation (beta = 0, uncentered); error refuses.
    # exact_form: true                      # [main] [default: decoder] exact form with intercept (bias) term.
    # ridge_relative: 0.01                  # ridge strength for fixed_relative (finite, > 0).
    # strength: 1.0                         # scale of the fitted task vector (finite, >= 0).
    # cascade_order: "independent"          # schema parity only, orders nothing: independent | bottom_top | top_bottom.
    # merge_mode: "per_task_then_merge"     # the only mode supported on LLMs (merge_in_source_then_fit raises).
    # component_target: "block_boundary"    # only block_boundary (output_local / output_total are retired).
    # realization_diagnostics: false        # [diagnostic] extra per-row realization fields in the summary.
    # residual_target: "transported_delta"  # [ablation] transported_delta | transported_endpoint.
    # alignment_map: "polar"                # [ablation] polar | ridge | random_isometry.
    # alignment_seed: 0                     # [ablation] seed of random_isometry.
    depth_pairing: relative                 # [main] source/target layer pairing: relative (target layer j <- source layer
                                            #   round(j*(Ds-1)/(Dt-1))) | spread_duplicate | [ablation] reversed | shift_plus1 |
                                            #   shift_minus1.
    # streaming_fingerprint_tol: 1.0e-9     # streaming consistency check tolerance (> 0); bf16 drift is reported.
    # copy_shape_matching_source_deltas: false # [ablation] also copy shape-matching source deltas of non-fitted
    #                                       #   parameters (embeddings, norms, ...); default: the task vector is only the fit.
    # procrustes_source: "activation"       # [vision-only] the decoder rejects gradient.
    # tv_scaling: "none"                    # [vision-only] the decoder rejects global | per_block.
    # tv_scaling_iters: 3                   # [vision-only]
    # fidelity_holdout: false               # [vision-only] [diagnostic]
    # fidelity_holdout_batches: 10          # [vision-only] [diagnostic]
    # block_split: "none"                   # [vision-only] the decoder rejects backfit | joint.
    # backfit_max_iters: 20                 # [vision-only]
    # backfit_tol: 1.0e-4                   # [vision-only]
    # alignment_row_weighting: "uniform"    # [vision-only] the decoder rejects cls_balanced | delta_magnitude.
    # endpoint_construction: "native_delta" # [vision-only] the decoder rejects the sequential modes.
    # calibration_data: "task_local"        # [vision-only] calibration images; text calibration is set below.

# ---------------------------------------------------------------- depth alignment (source depth -> target depth)
# depth_alignment:                          # Ariadne adds no layers, so there is no depth rule: ariadne_params.depth_pairing
                                            #   (below) is its depth handling. Nothing here is read for Ariadne.
  # Ariadne runs no depth step, so nothing under depth_alignment.brace applies. ariadne_params.num_batches sizes the
  # LLM calibration pool; a fit that still gets fewer batches than requested warns.
  # brace:
    # data:
      # num_batches: 2                      # legacy n_batches_act: enters the calibration-pool size only if larger than
      #                                     #   ariadne_params.num_batches; BRACE itself does not run for Ariadne.

# ---------------------------------------------------------------- merge
# merge:
  # weights: null                           # per-body weights (list or scalar); null = 1.0 each.

# ---------------------------------------------------------------- alpha search
alpha:
  search: false                             # search the task-vector scale on a grid.
  value: 1.0                                # fixed alpha when alpha.search is false.
  # min: 0.0                                # grid start.
  # max: 2.0                                # grid end.
  # step: 0.1                               # grid step (> 0).

# ---------------------------------------------------------------- artifacts
# save:
  # merged: null                            # path: save the rebased state at the selected alpha.

# ---------------------------------------------------------------- run, data and diagnostics
source_model_name_or_path: Qwen/Qwen2.5-0.5B # source base (HF id or local path; nodes are offline: cached).
target_model_name_or_path: Qwen/Qwen2.5-1.5B # target base.
model_kind: causal_lm                       # causal_lm | sequence_classification.
model_arch: qwen                            # family adapter: qwen | llama | t5 | auto (Qwen2, Qwen2.5, Qwen3; MoE fails fast).
tuned_bodies:                               # task -> fine-tuned source body (HF id or path), or a list per task.
  it: Qwen/Qwen2.5-0.5B-Instruct
device: cuda                                # torch device.
dtype: bf16                                 # fp16 | bf16 | fp32; null = checkpoint dtype.
# source_base_ckpt: null                    # override the source base weights.
# target_base_ckpt: null                    # override the target base weights.
# num_labels: 3                             # sequence_classification only.
# task_heads: null                          # sequence_classification: path to classifier heads.
# head_key_pattern: "modules_to_save"       # key filter for the heads.
# trust_remote_code: false                  # HF loading.
# use_fast_tokenizer: true                  # HF loading.
# Text source, first match wins: calibration_prompts > calibration_dataset > harness_tasks (held out from the
# evaluation docs). Pool size = max(n_batches_act, ariadne_params.num_batches) x calibration_batch_size sequences.
# Padding rows never enter any statistic: each model is masked by its own attention_mask.
seed: 0                                     # calibration partition seed (and hyperparam_search sampling).
calibration_batch_size: 4                   # calibration loader batch; default = batch_size, else 2.
calibration_max_length: 192                 # calibration token length (default 128).
# calibration_n_sequences: null             # explicit pool size (> 0) instead of the rule above.
# calibration_prompts: null                 # list of strings, or path to a JSON file {"prompts": [...]}.
# calibration_dataset: null                 # HF corpus decoupled from the evaluation (no hold-out): a path, or a mapping
#                                           #   {path, name|config, split, text_column | text_columns + text_template}
#                                           #   (text_columns + text_template build question/answer texts).
# calibration_include_target: false         # [ablation] append the gold target to harness calibration prompts.
# hyperparam_search: null                   # alpha and method_params sweep: {strategy: sequential | sobol,
#                                           #   num_samples: 16, refine_factor: 0.5, refinement_steps, refinement_samples,
#                                           #   alpha: <dim>}; <dim> = list | {values: [...]} |
#                                           #   {min, max, type: float | int, step}.
harness_tasks:                              # lm-eval tasks (list or CSV). Without suite/tasks: harness-only mode.
  - ifeval
harness_num_fewshot: 0                      # few-shot count.
harness_batch_size: 4                       # int or "auto".
# harness_limit: null                       # doc limit; exclusive with a held-out calibration slice.
# harness_samples: null                     # {task: [doc indices]} evaluated (must agree with the derived hold-out).
# harness_test_samples: null                # {task: [doc indices]} disjoint docs that re-score the best alpha.
# eval_mode: "auto"                         # auto (head_logits if task_heads else prompt) | prompt | head_logits.
# allow_prompt_eval: false                  # required for prompt evaluation on NLI.
# split: "validation"                       # train | validation | test.
# max_samples_per_task: null                # sample cap per task.
# max_prompt_tokens: null                   # prompt token cap.
# print_every: null                         # progress print interval.
# prompt_template: null                     # str with {premise} and {hypothesis}.
# batch_size: 8                             # head_logits loader batch.
# num_workers: 0                            # head_logits loader workers.
# max_length: 512                           # head_logits token length.
# task_mask_class: {}                       # {task: masked class or null}.
# fine_tuned_acc: null                      # {task: accuracy} reference for normalized accuracy.
# logging:                                  # W&B / local logging.
  # use_wandb: false
  # project: null
  # entity: null
  # tags: []
  # mode: "online"                          # online | offline | disabled (nodes are offline: use offline).
  # local_log_dir: null
  # log_every_n_steps: 50
  # run_name: null
