# BiCo on vision8 — reference config (every accepted key, annotated).
#
# Run:   python -m merge_and_rebase.eval.vision_rebase --config configs/examples/reference/vision/bico.yaml
# Twin:  configs/examples/vision8_bico_b16_to_l14.json (same active keys; tests/test_reference_configs.py)
#
# Legend
#   Active lines are the recommended setup (CLIP ViT-B/16 -> ViT-L/14, 8 tasks, discrete index-match depth rule).
#   "# key: value  # ..." lines list every other accepted key AT ITS DEFAULT: uncommenting one changes one factor.
#   Tags: [main] used by the method as published, [ablation] alternative arm, [diagnostic] extra measurement,
#         never changes the task vector, [legacy] kept for old configs, [deprecated] warns, [BRACE-only] inert
#         under depth_alignment.rule=discrete_index_match. [default: method] = value injected by depth_alignment.defaults: method.
#   Gradfix-only keys (method.params.mask_mode / vote, method.params.gradient.*) are omitted.
# Provenance: commit before launching; the summary records the git commit/dirty fingerprint.
# Unknown method.params keys of THESEUS/BiCo raise; unknown top-level keys are ignored.
# Canonical names (rebase/config_schema.py); the legacy flat names still work and warn.


# ---------------------------------------------------------------- suite
suite: vision8                              # task suite (key of SUITES).
tasks: all                                  # "all" or a comma-separated subset of the suite.

# ---------------------------------------------------------------- models and checkpoints
models:
  source:
    model: ViT-B-16                         # open_clip architecture of the source (fine-tuned) base.
    pretrained: datacomp_xl_s13b_b90k       # open_clip pretrained tag of the source base.
  target:
    model: ViT-L-14                         # open_clip architecture of the target base.
    pretrained: datacomp_xl_s13b_b90k       # open_clip pretrained tag of the target base.
  tuned_checkpoints:                        # task -> fine-tuned source checkpoint (required, one per task).
    Cars: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/Cars/best.pt
    DTD: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/DTD/best.pt
    EuroSAT: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/EuroSAT/best.pt
    GTSRB: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/GTSRB/best.pt
    MNIST: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/MNIST/best.pt
    RESISC45: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/RESISC45/best.pt
    SUN397: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/SUN397/best.pt
    SVHN: checkpoints/ViT-B-16/datacomp_xl_s13b_b90k/SVHN/best.pt

# ---------------------------------------------------------------- method (name + its own parameters)
method:
  name: bico                                # rebase method: theseus | bico | ariadne (alias direct_residual) | ...
  params:
    num_batches: 10                         # [main] calibration batches for the per-layer maps.
    seed: 89                                # map-fit sampling seed (vision: popped and used instead of top-level seed).
    # seq_align: "interpolate2d"            # token alignment between source and target grids:
    #                                       #   interpolate2d | interpolate | mean | cls.
    # center_acts: false                    # centre activations before the covariance.
    # batch_size: null                      # calibration batch-size override; null = top-level batch_size.
    # split_qkv: true                       # split fused qkv projections into q/k/v maps.
    # whiten_power: 0.0                     # [ablation] whitening exponent in [0, 0.5].
    # whiten_eps: 1.0e-6                    # whitening epsilon (> 0).
    # projection_input: "gradient"          # [main] input-side statistic: gradient | tokens | pooled.
    # transform_granularity: "param"        # only param for BiCo (other values raise).
    # device_transform: "cpu"               # device of the SVDs: cpu | gpu.
    # zero_attention_delta: false           # [ablation] zero the transported attention delta.
    # verbose: true                         # log progress.
    # show_progress: true                   # progress bars.
    # data:
      # source: "task_local"                # [ablation] task_local | tiny_imagenet (one task-independent paired
      #                                     #   context for every task's prepare; BiCo then scores Tiny-ImageNet labels).
      # protocol: "task_local"              # calibration of single-transport merge modes: task_local |
      #                                     #   task_local_10 | vision8_mix | vision8_mix_10 | tiny*.
      # max_samples: 2048                   # cap for the tiny* protocol.
      # num_batches: 10                     # batches for the mix protocols.
      # split: "val"                        # split for the mix protocols.
  # Injected by the stage, never set here (duplicate -> TypeError): source_model, target_model, source_dataloader,
  # target_dataloader, source_recipe, target_recipe, target_base, delta, device, source_activation_plan, family_adapter.

# ---------------------------------------------------------------- depth alignment (source depth -> target depth)
depth_alignment:
  defaults: method                          # method: BiCo -> depth_rule=discrete_index_match (paper-native: the
                                            #   source is re-indexed onto the target depth, statistics are taken on the
                                            #   re-indexed source); legacy: pre-release behaviour (BRACE). Absent: a
                                            #   depth mismatch raises ConfigMeaningChangedError.
  # enabled: true                           # run the depth prestep on a depth mismatch (the CLI sets true when absent).
  # rule: "method_default"                  # method_default | brace | discrete_index_match (BiCo default: discrete_index_match).
  # Source and target depth differ (12 -> 24 blocks). BiCo's default rule (discrete_index_match) re-indexes the source
  # blocks onto the target depth; every [BRACE-only] key below is then inert and warns when set. They take effect
  # only with depth_rule: brace (the legacy BiCo behaviour). Not read when the depths match.
  # brace:
    # blocks_to_add: null                   # [BRACE-only] blocks to insert; null = target depth - source depth.
    # target_layers_total: null             # [BRACE-only] explicit target depth; null = the target model's depth.
    # insertion_order: "bottom-top"         # [BRACE-only] bottom-top | top-bottom | random.
    # extension_density: "spread"           # [BRACE-only] anchor schedule: spread | spread_mod | clump.
    # collapse_schedule: "cascade"          # [BRACE-only] shrink schedule: cascade | disjoint_spans.
    # extension_strategy: "interpolate_per_weight" # [BRACE-only] [main] new-block init: interpolate_per_weight |
    #                                       #   duplicate_per_weight.
    # dampening_factor: 1.0                 # [BRACE-only] scale on the inserted block's output.
    # data:
      # num_batches: 2                      # calibration batches captured by BRACE (int > 0); unused by discrete_index_match.
      # split: "test"                       # split the BRACE calibration batches come from.
      # dataset: null                       # task-independent calibration set (str or dict); exclusive with data.task.
      # task: null                          # shorthand: calibrate every task on this one named task.
    # skip_correction: false                # [BRACE-only] skip the ridge correction of inserted blocks.
    # skip_final_ln: false                  # [BRACE-only] leave the final LayerNorm out of the correction.
    # ridge_identity: 0.0                   # [BRACE-only] ridge pull towards identity (>= 0).
    # ridge_weight: 1.0e-6                  # [BRACE-only] ridge weight of the correction (paper Eq. 9, >= 0).
    # n_cascade_iters: 1                    # [BRACE-only] cascade iterations (floored at 1).
    # share_ft_refs: false                  # [BRACE-only] share fine-tuned references across tasks.
    # component_ridge: null                 # [BRACE-only] per-component ridge override, {component: float}.
    # correction_endpoint: "per_endpoint"   # [BRACE-only] per_endpoint | steer | base | finetuned.
    # reference_capture: "lazy"             # [BRACE-only] lazy | eager.
    # inserted_block_mode: "ariadne"        # [BRACE-only] [ablation] ariadne | residual_identity | residual_identity_inert
    #                                       #   (non-ariadne needs skip_correction=true).
    # target_shared_correction:             # [BRACE-only] [ablation] absent = off. Blend target activations into the
    #                                       #   correction target; needs skip_correction=false, correction_endpoint=base, inserted_block_mode=ariadne.
      # enabled: true                       # false == absent.
      # target_weight: 0.0                  # required, >= 0; 0 reproduces standard BRACE.
      # component: "c_proj"                 # only c_proj.
      # added_blocks: "all"                 # only all.
      # num_batches: null                   # must equal data.num_batches when set.
    # correction_scope: "inserted"          # [BRACE-only] [ablation] inserted | interleaved_once | iterative_all.
    # transport_activation_mode: "model"    # [BRACE-only] [ablation] model | interpolate_neighbors: how BiCo reads
    #                                       #   the inserted position's source activations (interpolate_neighbors needs
    #                                       #   skip_correction=true).
    # insertion_target_mode: "direct"       # [BRACE-only] ridge fit target: direct | residual.
    # eval_before_extension: false          # [diagnostic] read only by the BRACE diagnostic CLI
    #                                       #   (python -m merge_and_rebase.eval.diagnostics.vision_block_extension).
    # first_n_eval_batches: null            # [diagnostic] read only by that diagnostic CLI.
    # verbose: true                         # log BRACE progress.
    # show_progress: true                   # progress bars.

# ---------------------------------------------------------------- merge
# merge:
  # weights: null                           # per-task merge weights, list of len(tasks); null = 1.0 each.
  # mode: "none"                            # none | rebase_then_merge | merge_then_rebase | brace_transport_then_merge |
  #                                         #   brace_merge_then_transport | merge_then_brace_then_transport.
  # method: "task_arithmetic"               # merge algorithm (merge registry name).
  # params: {}                              # merge kwargs.
  # global_alpha_search: true               # hierarchical global alpha for merges.
  # base_construction: "per_task"           # per_task | independent_endpoint_average.

# ---------------------------------------------------------------- alpha search
alpha:
  search: true                              # search the task-vector scale on a grid.
  min: 0.0                                  # grid start.
  max: 1.0                                  # grid end (>= alpha.min).
  step: 0.05                                # grid step (> 0).
  selection: per_task                       # per_task: one alpha per task; shared: one alpha for all.
  split: val                                # split used to pick alpha: val | test.
  # value: 1.0                              # fixed alpha, used only when alpha.search is false.
  # patience: 0                             # early stop of the alpha grid after N non-improving steps (0 = off).

# ---------------------------------------------------------------- artifacts
save:
  transported_task_vectors_policy: auto     # auto: save transported task vectors to <summary_dir>/transported_tvs;
                                            #   if_dir_given (default): only when save.transported_task_vectors is set.
  # transported_task_vectors: null          # explicit directory for the transported task vectors.
  # transported_artifacts: false            # also save artifacts; default = (save.transported_task_vectors is set).
  # legacy_task_vector_layouts: false       # [legacy] legacy save format.
  # merged: null                            # path: save the merged state dict.

# ---------------------------------------------------------------- run, data and diagnostics
# dtype: null                               # model dtype: fp16 | bf16 | fp32; null = checkpoint dtype.
# device: "cuda"                            # torch device.
# strict_load: false                        # strict state-dict loading of the checkpoints.
# native_target_tasks: []                   # tasks whose checkpoints already live on the target base (mixed merging).
# auto_detect_ckpt_base: true               # classify each checkpoint's base by key coverage.
# attn_patch_cfg: null                      # attention patch config (dict); enables patched_attn when set.
# patched_attn: false                       # patch attention before rebase; default = (attn_patch_cfg is not null).
batch_size: 32                              # loader batch size (calibration, alpha search, evaluation).
num_workers: 0                              # loader workers.
val_fraction: 0.1                           # fraction of train held out as the validation split.
seed: 89                                    # global seed: splits, loaders, calibration sampling.
# humanize_classnames: false                # true = raw class names in the zero-shot head; false = humanized names.
# eval_before_rebase: false                 # [diagnostic] evaluate the (extended) source on the target task first.
# block_extension_eval_split: "test"        # [diagnostic] split for eval_before_rebase: val | test.
# logging:                                  # W&B / local logging.
  # use_wandb: false
  # project: null
  # entity: null
  # tags: []
  # mode: "online"                          # online | offline | disabled (nodes are offline: use offline).
  # local_log_dir: null
  # log_every_n_steps: 50
  # run_name: null
# source_only: false                        # [diagnostic] stop after the source-side steps.
